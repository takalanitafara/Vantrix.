name: Deployment verification
on:
  push:
  workflow_dispatch:
    inputs:
      production_url:
        description: 'Exact public HTTPS Vantrix deployment URL to verify'
        required: false
        type: string
permissions:
  contents: read
jobs:
  docker-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright==1.64.0
      - run: python -m playwright install --with-deps chromium
      - name: Build Docker image
        run: docker build --pull -t vantrix:verify .
      - name: Run container and verify non-root user
        run: |
          docker run -d --name vantrix -p 8000:8000 vantrix:verify
          test "$(docker exec vantrix id -u)" != "0"
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:8000/health
      - name: Browser checks against container
        run: python tests/browser_check.py
      - name: Verify custom PORT in container
        run: |
          docker run -d --name vantrix-custom -e PORT=8080 -p 8080:8080 vantrix:verify
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:8080/health
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-browser-results
          path: artifacts/
      - name: Container logs
        if: always()
        run: docker logs vantrix; docker logs vantrix-custom || true
  production-browser:
    # Production smoke checks run on pushes and may target an explicit URL manually.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright==1.64.0
      - run: python -m playwright install --with-deps chromium
      - name: Check public production endpoints and browser
        env:
          BASE_URL: ${{ inputs.production_url || 'https://vantrix-plum.vercel.app' }}
        run: python tests/browser_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-browser-results
          path: artifacts/
