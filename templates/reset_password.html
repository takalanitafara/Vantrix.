{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="authbox">
  <h1>Set a new password</h1>
  <p class="muted">This link is single-use and expires shortly. Your account
  email is never shown on this page.</p>
  <form method="post" action="/reset-password">
    <input type="hidden" name="token" value="{{ token }}">
    <label>New password <input type="password" name="new_password" minlength="8" required autofocus></label>
    <label>Confirm password <input type="password" name="confirm_password" minlength="8" required></label>
    <button class="btn primary wide" type="submit">Update password</button>
  </form>
</div>
{% endblock %}
